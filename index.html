<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- [CODE] DEMO ONLY banner. app.js fills it in and shows it when demo_only is true in business.json. -->
  <div id="demo-banner" class="banner" role="note" hidden></div>

  <!-- [CODE] Header. Words come from business.json through app.js (data-bind). -->
  <header class="site-header">
    <h1 data-bind="name">Sample website</h1>
    <p data-bind="tagline">Your tagline</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="seam.html">How this works</a>
    </nav>
  </header>

  <main>
    <!-- [CODE] Facts about the business. Edit business.json, not this file. -->
    <section>
      <h2>What we do</h2>
      <p>We serve: <span data-bind="service_area"></span></p>
      <ul id="services-list"></ul>
      <p><strong>Hours:</strong> <span data-bind="hours_text"></span></p>
    </section>

    <!-- [CODE-FORMAT] Contact form. Sent by app.js to Web3Forms; the email subject is built by code. -->
    <section>
      <h2>Send us a message</h2>
      <form id="contact-form">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" required autocomplete="name">

        <label for="email">Your email</label>
        <input id="email" name="email" type="email" required autocomplete="email">

        <label for="message">How can we help?</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <!-- Spam trap: people never see this box, bots tick it. -->
        <input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit">Send message</button>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- [CODE] Voice demo (web call only). The conversation itself is [AGENT] work: see voice/persona.md. -->
    <section id="voice">
      <h2>Talk to our demo assistant</h2>
      <p id="voice-note" class="status"></p>
      <button id="voice-btn" type="button" hidden>Start voice demo</button>
      <p id="voice-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <p>Built from a free template. Fictional business, for learning.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
